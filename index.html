    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.users) && Array.isArray(parsed.matches)) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn('Erro ao ler localStorage, restaurando dados iniciais:', e);
      }
      const seed = getInitialSeedData();
      saveDatabase(seed);
      return seed;
    }

    function saveDatabase(target = db) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(target));

      }
    }

    function calculateHaversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function formatDistance(lat, lng) {
      const km = calculateHaversineKm(
        appState.userLocation.lat,
        appState.userLocation.lng,
        lat,
        lng
      );
      if (km < 1) {
        return `${Math.max(150, Math.round(km * 1000))} m`;
      }
      return `${km.toFixed(1).replace('.', ',')} km`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colors = {
        success: 'bg-[#12181F] border-[#16A34A] text-white',
        error: 'bg-[#1F1215] border-red-500 text-red-100',
        info: 'bg-[#12181F] border-sky-500 text-sky-100',
        warning: 'bg-[#1F1A12] border-amber-500 text-amber-100',
      };
      const icons = {
        success: '✅',
        error: '⚠️',
        info: 'ℹ️',
        warning: '🔔',
      };
      el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-2xl text-sm font-medium animate-view ${colors[type] || colors.success}`;
      el.innerHTML = `<span class="text-base">${icons[type] || '✅'}</span><span class="flex-1 leading-snug">${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 3200);
    }

    function navigateToTab(tab) {

        openConfirmModal({
          title: 'Descartar partida?',
          message: 'Você tem alterações não salvas na criação da partida. Deseja realmente sair?',
          confirmText: 'Sair e descartar',
          danger: true,
          onConfirm: () => {
            appState.createDirty = false;
            appState.createStep = 1;
            appState.createForm = getDefaultCreateForm();
            appState.activeTab = tab;
            appState.subView = null;
            renderApp();
          },
        });
        return;
      }

      if ((tab === 'create' || tab === 'my_matches' || tab === 'profile') && !appState.currentUser) {
        promptLoginRequired('Faça login para criar partidas, acompanhar seus jogos ou acessar seu perfil.');
        return;

      appState.activeTab = tab;
      appState.subView = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const q = loginState.username.trim().toLowerCase().replace(/^@/, '');
      const pwd = loginState.password.trim();
      const user = db.users.find(
        u => (u.username.toLowerCase() === q || u.email.toLowerCase() === q) && u.password === pwd
      );
      if (!user) {
        showToast('Usuário ou senha inválidos. Tente dudu / 1234.', 'error');
        return;
      }
      appState.currentUser = user;
      appState.guestMode = false;
      appState.activeTab = 'home';
      showToast(`Bem-vindo de volta, ${user.name.split(' ')[0]}! ⚽`);
      renderApp();
    }

    function toggleRegSport(sportId) {
      if (loginState.regSports.includes(sportId)) {
        loginState.regSports = loginState.regSports.filter(s => s !== sportId);
      } else {
        loginState.regSports.push(sportId);
      }
      renderApp();
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const cleanUser = loginState.regUsername.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
      if (!cleanUser || loginState.regPassword.length < 4) {
        showToast('Preencha um @username válido e senha com ao menos 4 caracteres.', 'error');
        return;
      }
      if (db.users.some(u => u.username.toLowerCase() === cleanUser)) {
        showToast('Este @username já está em uso.', 'error');
        return;
      }

      const newUser = {
        id: 'u_' + Date.now(),
        username: cleanUser,
        password: loginState.regPassword,
        name: loginState.regName.trim(),
        email: loginState.regEmail.trim(),
        city: loginState.regCity,
        avatar: loginState.regAvatar,
        favoriteSports: loginState.regSports.length ? loginState.regSports : ['society'],
        paymentMethod: { type: 'PIX', label: loginState.regEmail.trim(), verified: true },
        isCourtOwner: false,
      };

      db.users.push(newUser);
      saveDatabase();
      appState.currentUser = newUser;
      appState.guestMode = false;
      appState.activeTab = 'home';
      showToast('Conta criada com sucesso! Bem-vindo ao PelApp!');
      renderApp();
    }

    function handleAvatarFileUpload(event, target) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        const dataUrl = ev.target?.result;
        if (!dataUrl) return;
        if (target === 'register') {
          loginState.regAvatar = dataUrl;
          renderApp();
        } else if (target === 'profile' && appState.currentUser) {
          appState.currentUser.avatar = dataUrl;
          const idx = db.users.findIndex(u => u.id === appState.currentUser.id);
          if (idx !== -1) db.users[idx].avatar = dataUrl;
          saveDatabase();
          showToast('Foto de perfil atualizada!');
          renderApp();
        }
      };
      reader.readAsDataURL(file);
    }

    function enterAsGuest() {
      appState.currentUser = null;
      appState.guestMode = true;
      appState.activeTab = 'home';
      showToast('Modo Visitante ativado. Explore partidas e quadras!', 'info');
      renderApp();
    }

    // 10. TELA EXPLORAR: PARTIDAS E QUADRAS & ARENAS + MAPA LEAFLET (ExploreView)
    // ----------------------------------------------------------------------------
    let leafletMapInstance = null;
    let selectedMapItem = null; // { type: 'match' | 'court', item }

    function getFilteredMatches() {
      const f = appState.exploreFilters;
      const q = appState.exploreSearch.trim().toLowerCase();
      const today = getRelativeDateISO(0);
      const tomorrow = getRelativeDateISO(1);
      const weekLimit = getRelativeDateISO(7);

      return db.matches.filter(m => {
        if (m.status !== 'active') return false;
        if (q && !m.title.toLowerCase().includes(q) && !m.locationName.toLowerCase().includes(q) && !getSportById(m.sportId).name.toLowerCase().includes(q)) {
          return false;
        }
        if (f.sport !== 'all' && m.sportId !== f.sport) return false;
        const dist = calculateHaversineKm(appState.userLocation.lat, appState.userLocation.lng, m.lat, m.lng);
        if (dist > f.maxDistance) return false;
        if (f.dateFilter === 'today' && m.date !== today) return false;
        if (f.dateFilter === 'tomorrow' && m.date !== tomorrow) return false;
        if (f.dateFilter === 'week' && (m.date < today || m.date > weekLimit)) return false;
        if (f.level !== 'all' && m.level !== f.level) return false;
        if (f.onlyAvailable && m.participants.length >= m.maxPlayers) return false;
        if (f.priceFilter === 'free' && m.isPaid) return false;
        if (f.priceFilter === 'paid' && !m.isPaid) return false;
        return true;
      });
    }

    function getFilteredCourts() {
      const f = appState.exploreFilters;
      const q = appState.exploreSearch.trim().toLowerCase();

      return db.courts.filter(c => {
        if (q && !c.name.toLowerCase().includes(q) && !c.neighborhood.toLowerCase().includes(q) && !c.surface.toLowerCase().includes(q)) {
          return false;
        }
        if (f.sport !== 'all' && !c.sports.includes(f.sport)) return false;
        const dist = calculateHaversineKm(appState.userLocation.lat, appState.userLocation.lng, c.lat, c.lng);
        if (dist > f.maxDistance) return false;
        if (f.surface !== 'all' && !c.surface.toLowerCase().includes(f.surface.toLowerCase())) return false;
        return true;
      });
    }

    function initExploreLeafletMap(matches, courts) {
      const container = document.getElementById('explore-leaflet-map');
      if (!container || typeof L === 'undefined') return;

      if (leafletMapInstance) {
        leafletMapInstance.remove();
        leafletMapInstance = null;
      }

      leafletMapInstance = L.map('explore-leaflet-map', {
        center: [appState.userLocation.lat, appState.userLocation.lng],
        zoom: 14,
        zoomControl: true,
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
      }).addTo(leafletMapInstance);

      // Marcador do Usuário
      const userIcon = L.divIcon({
        className: '',
        html: '<div class="user-pulse-pin"></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      L.marker([appState.userLocation.lat, appState.userLocation.lng], { icon: userIcon }).addTo(leafletMapInstance);

      // Pins de Partidas ou Quadras
      if (appState.exploreTab === 'matches') {
        matches.forEach(m => {
          const sp = getSportById(m.sportId);
          const pinIcon = L.divIcon({
            className: '',
            html: `<div class="pelapp-pin" style="width:36px;height:36px;background:${sp.color};">${sp.icon}</div>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18],
          });
          const marker = L.marker([m.lat, m.lng], { icon: pinIcon }).addTo(leafletMapInstance);
          marker.on('click', () => {
            selectedMapItem = { type: 'match', item: m };
            renderExploreView();
          });
        });
      } else {
        courts.forEach(c => {
          const pinIcon = L.divIcon({
            className: '',
            html: `<div class="pelapp-pin" style="width:36px;height:36px;background:#F59E0B;">🏟️</div>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18],
          });
          const marker = L.marker([c.lat, c.lng], { icon: pinIcon }).addTo(leafletMapInstance);
          marker.on('click', () => {
            selectedMapItem = { type: 'court', item: c };
            renderExploreView();
          });
        });
      }
    }

    function organizeMatchAtCourt(courtId) {
      if (!appState.currentUser) {
        promptLoginRequired('Entre na sua conta para organizar uma partida nesta quadra.');
        return;
      }
      const court = db.courts.find(c => c.id === courtId);
      appState.createForm = getDefaultCreateForm();
      if (court) {
        appState.createForm.sportId = court.sports[0] || 'society';
        appState.createForm.courtId = court.id;
        appState.createForm.locationName = court.name;
        appState.createForm.address = court.address;
        appState.createForm.lat = court.lat;
        appState.createForm.lng = court.lng;
        appState.createForm.manualLocation = false;
      }
      appState.createStep = 1;
      appState.createDirty = true;
      appState.activeTab = 'create';
      appState.subView = null;
      renderApp();
    }

    function startCourtBooking(courtId, dayKey, slotId) {
      if (!appState.currentUser) {
        promptLoginRequired('Faça login para reservar um horário na quadra.');
        return;
      }
      const court = db.courts.find(c => c.id === courtId);
      const slot = court?.schedule[dayKey]?.find(s => s.id === slotId);
      if (!court || !slot) return;

      openPaymentModal({
        title: `Reserva • ${court.name}`,
        subtitle: `Dia: ${WEEK_DAYS.find(d => d.key === dayKey)?.label} • Horário: ${slot.time}`,
        amount: slot.price,
        pixCode: `00020126580014BR.GOV.BCB.PIX0136pelapp-quadra-${court.id}@pix.br5204000053039865406${slot.price.toFixed(2)}5802BR5913PELAPP ARENAS6010OURO PRETO62070503***6304A1B2`,
        onSuccess: (method) => {
          slot.status = 'occupied';
          slot.reservedBy = appState.currentUser.name;
          const receipt = {
            id: 'REC-' + Math.floor(100000 + Math.random() * 900000),
            userId: appState.currentUser.id,
            title: `Reserva de Quadra: ${court.name}`,
            detail: `${WEEK_DAYS.find(d => d.key === dayKey)?.label} • ${slot.time}`,
            amount: slot.price,
            method,
            date: new Date().toLocaleString('pt-BR'),
          };
          db.receipts.unshift(receipt);
          addNotification(
            appState.currentUser.id,
            'Quadra Reservada! 🏟️',
            `Horário ${slot.time} confirmado em ${court.name}.`,
            null
          );
          saveDatabase();
          triggerConfetti();
          renderApp();
          openReceiptModal(receipt);
        },
      });
    }

                      </button>

          <!-- Etapa 6: Resumo & Publicar -->

    function selectCreateSport(sportId) {
      const sp = getSportById(sportId);
      appState.createForm.sportId = sportId;
      appState.createForm.maxPlayers = sp.defaultPlayers;
      if (!appState.createForm.title) {
        appState.createForm.title = `Racha de ${sp.name} — Ouro Preto`;
      }
      appState.createDirty = true;
      renderApp();
    }

    function selectCreateCourt(courtId) {
      const court = db.courts.find(c => c.id === courtId);
      if (!court) return;
      appState.createForm.courtId = court.id;
      appState.createForm.locationName = court.name;
      appState.createForm.address = court.address;
      appState.createForm.lat = court.lat;
      appState.createForm.lng = court.lng;
      appState.createDirty = true;
      renderApp();
    }

    function advanceCreateStep() {
      const step = appState.createStep;
      const f = appState.createForm;
      if (step === 2 && !f.title.trim()) {
        f.title = `Racha de ${getSportById(f.sportId).name} — Ouro Preto`;
      }
      if (step === 4 && !f.locationName.trim()) {
        showToast('Informe o nome do local da partida.', 'error');
        return;
      }
      appState.createStep++;
      renderApp();
    }

    function publishNewMatch() {
      const f = appState.createForm;
      const sport = getSportById(f.sportId);

      const newMatch = {
        id: 'm_' + Date.now(),
        sportId: f.sportId,
        title: f.title.trim() || `Racha de ${sport.name}`,
        description: f.description.trim() || 'Partida organizada pela comunidade PelApp em Ouro Preto.',
        level: f.level,
        maxPlayers: Number(f.maxPlayers) || sport.defaultPlayers,
        date: f.date,
        time: f.time,
        duration: Number(f.duration) || 90,
        courtId: f.courtId,
        locationName: f.locationName.trim(),
        address: f.address.trim() || 'Ouro Preto, MG',
        lat: f.lat || appState.userLocation.lat,
        lng: f.lng || appState.userLocation.lng,
        isPaid: Boolean(f.isPaid),
        price: f.isPaid ? Number(f.price) : 0,
        paymentType: f.paymentType,
        approvalRequired: false,
        waitlistEnabled: Boolean(f.waitlistEnabled),
        reminder24h: Boolean(f.reminder24h),
        rules: f.rules.trim(),
        organizerId: appState.currentUser.id,
        participants: [appState.currentUser.id],
        waitlist: [],
        pendingRequests: [],
        paidUsers: [appState.currentUser.id],
        status: 'active',
      };

      db.matches.unshift(newMatch);
      db.messages[newMatch.id] = [
        {
          id: 'msg_' + Date.now(),
          userId: appState.currentUser.id,
          text: `Partida criada! Quem animar já confirma presença aqui ⚽🔥`,
          time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
        },
      ];
      addNotification(
        appState.currentUser.id,
        'Partida Publicada! 🚀',
        `"${newMatch.title}" já está visível para atletas da região.`,
        newMatch.id
      );

      saveDatabase();
      appState.createDirty = false;
      appState.createStep = 1;
      appState.createForm = getDefaultCreateForm();
      triggerConfetti();
      openMatchPublishedSuccessModal(newMatch);
    }

    function joinMatch(matchId) {
      if (!appState.currentUser) {
        promptLoginRequired('Entre na sua conta para confirmar presença na partida.');
        return;
      }
      const match = db.matches.find(m => m.id === matchId);
      if (!match) return;

      if (match.participants.includes(appState.currentUser.id)) return;
      if (match.participants.length >= match.maxPlayers) {
        showToast('As vagas acabaram de ser preenchidas!', 'warning');
        renderApp();
        return;
      }

      // Fluxo de Pagamento Antecipado PIX obrigatório
      if (match.isPaid && match.paymentType === 'advance_pix') {
        openPaymentModal({
          title: `Cota da Partida • ${match.title}`,
          subtitle: `${formatDateBR(match.date)} às ${match.time} • ${match.locationName}`,
          amount: match.price,
          pixCode: `00020126580014BR.GOV.BCB.PIX0136pelapp-jogo-${match.id}@pix.br5204000053039865405${match.price.toFixed(2)}5802BR5913PELAPP JOGOS6010OURO PRETO62070503***6304F9E1`,
          onSuccess: (method) => {
            match.participants.push(appState.currentUser.id);
            match.paidUsers.push(appState.currentUser.id);
            const receipt = {
              id: 'PIX-' + Math.floor(100000 + Math.random() * 900000),
              userId: appState.currentUser.id,
              matchId: match.id,
              title: match.title,
              detail: `${formatDateBR(match.date)} às ${match.time} • ${match.locationName}`,
              amount: match.price,
              method,
              date: new Date().toLocaleString('pt-BR'),
            };
            db.receipts.unshift(receipt);
            addNotification(
              appState.currentUser.id,
              'Presença e PIX Confirmados! ⚡',
              `Você está dentro de "${match.title}".`,
              match.id
            );
            saveDatabase();
            triggerConfetti();
            renderApp();
            openReceiptModal(receipt);
          },
        });
        return;
      }

      // Confirmação Direta
      match.participants.push(appState.currentUser.id);
      addNotification(
        appState.currentUser.id,
        'Presença Confirmada! ⚽',
        `Você confirmou presença em "${match.title}".`,
        match.id
      );
      saveDatabase();
      triggerConfetti();
      showToast('Presença confirmada! Nos vemos em quadra! ⚽');
      renderApp();
    }

    function joinWaitlist(matchId) {
      if (!appState.currentUser) {
        promptLoginRequired('Entre na sua conta para entrar na lista de suplentes.');
        return;
      }
      const match = db.matches.find(m => m.id === matchId);
      if (!match) return;
      if (!match.waitlist.includes(appState.currentUser.id)) {
        match.waitlist.push(appState.currentUser.id);
        const pos = match.waitlist.length;
        addNotification(
          appState.currentUser.id,
          `Suplente #${pos} na fila ⏳`,
          `Você entrou na fila de suplentes de "${match.title}".`,
          match.id
        );
        saveDatabase();
        showToast(`Você entrou como Suplente #${pos}!`);
        renderApp();
      }
    }

    function leaveWaitlist(matchId) {
      const match = db.matches.find(m => m.id === matchId);
      if (!match || !appState.currentUser) return;
      match.waitlist = match.waitlist.filter(id => id !== appState.currentUser.id);
      saveDatabase();
      showToast('Você saiu da lista de suplentes.', 'info');
      renderApp();
    }

    function confirmLeaveMatch(matchId) {
      openConfirmModal({
        title: 'Cancelar presença?',
        message: 'Sua vaga será liberada imediatamente e, se houver lista de suplentes, o próximo jogador da fila será promovido.',
        confirmText: 'Sim, liberar vaga',
        danger: true,
        onConfirm: () => {
          const match = db.matches.find(m => m.id === matchId);
          if (!match || !appState.currentUser) return;
          match.participants = match.participants.filter(id => id !== appState.currentUser.id);

          // Promoção automática do próximo suplente
          if (match.waitlistEnabled && match.waitlist.length > 0) {
            const promotedUserId = match.waitlist.shift();
            match.participants.push(promotedUserId);
            const promotedUser = getUserById(promotedUserId);
            addNotification(
              promotedUserId,
              'Vaga Liberada! Você foi promovido 🎉',
              `Você saiu da fila de suplentes e entrou em "${match.title}" (15 min de reserva garantida).`,
              match.id
            );
            showToast(`Presença cancelada. Suplente ${promotedUser.name.split(' ')[0]} foi promovido automaticamente!`, 'info');
          } else {
            showToast('Presença cancelada com sucesso.', 'info');
          }

          saveDatabase();
          renderApp();
        },
      });
    }

    function shareMatch(matchId) {
      const match = db.matches.find(m => m.id === matchId);
      if (!match) return;
      const sport = getSportById(match.sportId);
      const text = `⚽ Bora jogar no PelApp!\n${sport.icon} ${match.title}\n🗓️ ${formatDateBR(match.date)} às ${match.time}\n📍 ${match.locationName}\nVagas: ${match.participants.length}/${match.maxPlayers}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      showToast('Convite copiado para a área de transferência! 📋');
    }

    function sendMatchChatMessage(e, matchId) {
      e.preventDefault();
      if (!appState.currentUser) return;
      const input = document.getElementById('chat-input');
      const text = input?.value.trim();
      if (!text) return;

      if (!db.messages[matchId]) db.messages[matchId] = [];
      db.messages[matchId].push({
        id: 'msg_' + Date.now(),
        userId: appState.currentUser.id,
        text,
        time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
      });
      saveDatabase();
      renderMatchChatView();
    }

          renderApp();

    function toggleCourtSlotStatus(courtId, dayKey, slotId) {
      const court = db.courts.find(c => c.id === courtId);
      const slot = court?.schedule[dayKey]?.find(s => s.id === slotId);
      if (!slot) return;
      slot.status = slot.status === 'available' ? 'occupied' : 'available';
      slot.reservedBy = slot.status === 'occupied' ? 'Bloqueio Manual' : null;
      saveDatabase();
      showToast(`Horário ${slot.time} marcado como ${slot.status === 'available' ? 'Liberado' : 'Reservado'}.`);
      renderApp();
    }

    function addCustomCourtSlot(e, courtId, dayKey) {
      e.preventDefault();
      const court = db.courts.find(c => c.id === courtId);
      const timeVal = document.getElementById('custom-slot-time')?.value.trim();
      const priceVal = Number(document.getElementById('custom-slot-price')?.value) || court.pricePerHour;
      if (!court || !timeVal) return;

      court.schedule[dayKey].push({
        id: dayKey + '_' + Date.now(),
        time: timeVal,
        price: priceVal,
        status: 'available',
        reservedBy: null,
      });
      saveDatabase();
      showToast(`Horário ${timeVal} adicionado!`);
      renderApp();
    }

    function replicateDayToWeek(courtId, sourceDayKey) {
      const court = db.courts.find(c => c.id === courtId);
      if (!court) return;
      const template = court.schedule[sourceDayKey] || [];
      WEEK_DAYS.forEach(d => {
        if (d.key !== sourceDayKey) {
          court.schedule[d.key] = template.map((s, idx) => ({
            ...s,
            id: `${d.key}_${Date.now()}_${idx}`,
          }));
        }
      });
      saveDatabase();
      showToast('Grade replicada para todos os dias da semana! 📋');
      renderApp();
    }

    function detectBrowserGPS() {
      if (!navigator.geolocation) {
        showToast('Geolocalização não suportada neste navegador.', 'error');
        return;

      showToast('Obtendo coordenadas GPS...', 'info');
      navigator.geolocation.getCurrentPosition(
        pos => {
          appState.userLocation = {
            city: 'Ouro Preto, MG (GPS)',
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            gpsActive: true,
          };
          closeModal();
          showToast('Localização GPS atualizada com sucesso! 🛰️');
          renderApp();
        },
        () => {

                  <input type="text" value="4532 •••• •••• 8819" readonly class="w-full px-3.5 py-2.5 rounded-xl bg-[#0B0F12] border border-white/10 text-xs text-slate-300" />
                  <p class="text-[11px] text-amber-300 bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-xl">
                    ⚠️ No protótipo demonstrativo, pagamentos via cartão simulam recusa da operadora. Utilize o <strong>PIX Instantâneo</strong> para aprovação imediata.
                  </p>
                  <button type="button" onclick="showToast('Operadora recusou o cartão demo. Utilize o PIX Instantâneo.', 'error')" class="w-full py-3 rounded-xl bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold">
                    Testar Cobrança no Cartão
                  </button>
                </div>
              `}
            </div>
          </div>
        `;

        document.getElementById('pay-tab-pix')?.addEventListener('click', () => {
          payTab = 'pix';
          renderPayInner();
        });
        document.getElementById('pay-tab-card')?.addEventListener('click', () => {
          payTab = 'card';
          renderPayInner();
        });
      };

      renderPayInner();
    }

    function openReceiptModalById(receiptId) {
      const r = db.receipts.find(item => item.id === receiptId);
      if (r) openReceiptModal(r);
    }

    function openReceiptModal(receipt) {
      const root = document.getElementById('modal-root');
      window.__downloadReceiptTxt = () => {
        const content = [
          '========================================',
          '       PELAPP — COMPROVANTE PIX         ',
          '========================================',
          `Recibo: ${receipt.id}`,
          `Data/Hora: ${receipt.date}`,
          `Descrição: ${receipt.title}`,
          `Detalhes: ${receipt.detail}`,
          `Valor Pago: R$ ${Number(receipt.amount).toFixed(2)}`,
          `Método: ${receipt.method}`,
          `Status: APROVADO`,
          '========================================',
          'Ouro Preto, MG — O jogo não espera.',
        ].join('\n');

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `comprovante_${receipt.id}.txt`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Comprovante baixado em .txt!');
      };

      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-view">
          <div class="w-full max-w-[400px] rounded-3xl bg-[#12181F] border border-emerald-500/40 p-5 shadow-2xl space-y-4 text-center">
            <div class="w-14 h-14 rounded-full bg-[#16A34A]/20 border border-[#16A34A] text-[#22C55E] flex items-center justify-center text-2xl mx-auto">
              ✓
            </div>
            <div>
              <h3 class="font-sport text-2xl text-white">Pagamento Confirmado!</h3>
              <p class="text-xs text-slate-400">Comprovante #${receipt.id}</p>
            </div>

            <div class="p-3.5 rounded-2xl bg-[#0B0F12] border border-white/10 text-left space-y-1.5 text-xs">
              <div class="flex justify-between"><span class="text-slate-400">Item:</span><strong class="text-white text-right">${receipt.title}</strong></div>
              <div class="flex justify-between"><span class="text-slate-400">Detalhes:</span><span class="text-slate-200 text-right">${receipt.detail}</span></div>
              <div class="flex justify-between"><span class="text-slate-400">Valor:</span><strong class="text-[#22C55E]">R$ ${Number(receipt.amount).toFixed(2).replace('.', ',')}</strong></div>
              <div class="flex justify-between"><span class="text-slate-400">Data:</span><span class="text-slate-300">${receipt.date}</span></div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="window.__downloadReceiptTxt()" class="py-3 rounded-xl bg-[#18222C] hover:bg-[#22303E] border border-white/10 text-xs font-bold text-white">
                ⬇️ Baixar .TXT
              </button>
              <button onclick="closeModal()" class="py-3 rounded-xl bg-[#16A34A] text-white text-xs font-bold">
                Concluir
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function openMatchPublishedSuccessModal(match) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-view">
          <div class="w-full max-w-[400px] rounded-3xl bg-[#12181F] border border-[#16A34A]/50 p-6 shadow-2xl space-y-4 text-center">
            <div class="text-4xl">🏆</div>
            <h3 class="font-sport text-2xl text-white">Partida Publicada!</h3>
            <p class="text-xs text-slate-300 leading-relaxed">
              <strong>"${match.title}"</strong> já está aberta para a comunidade de Ouro Preto confirmar presença!
            </p>
            <div class="space-y-2 pt-2">
              <button onclick="shareMatch('${match.id}')" class="w-full py-3 rounded-xl bg-[#18222C] border border-white/10 text-xs font-bold text-[#22C55E]">
                📤 Copiar Link de Convite
              </button>
              <button onclick="closeModal(); openMatchDetail('${match.id}');" class="w-full py-3.5 rounded-xl bg-[#16A34A] text-white font-sport text-base tracking-wider">
                Ver Página da Partida →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function openEditProfileModal() {
      const user = appState.currentUser;
      const root = document.getElementById('modal-root');
      let editName = user.name;
      let editCity = user.city;
      let editSports = [...(user.favoriteSports || [])];

      window.__toggleEditSport = (sid) => {
        if (editSports.includes(sid)) editSports = editSports.filter(s => s !== sid);
        else editSports.push(sid);
        document.querySelectorAll('[data-edit-sport]').forEach(btn => {
          const id = btn.getAttribute('data-edit-sport');
          const active = editSports.includes(id);
          btn.className = `px-2.5 py-1.5 rounded-full text-xs font-semibold border transition ${active ? 'bg-[#16A34A]/20 border-[#16A34A] text-[#22C55E]' : 'bg-[#18222C] border-white/10 text-slate-400'}`;
        });
      };

      window.__saveEditedProfile = (e) => {
        e.preventDefault();
        user.name = editName.trim() || user.name;
        user.city = editCity;
        user.favoriteSports = editSports;
        const idx = db.users.findIndex(u => u.id === user.id);
        if (idx !== -1) db.users[idx] = { ...user };
        saveDatabase();
        closeModal();
        showToast('Perfil atualizado com sucesso!');
        renderApp();
      };

      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 animate-view">
          <form onsubmit="window.__saveEditedProfile(event)" class="w-full max-w-[420px] rounded-3xl bg-[#12181F] border border-white/15 p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="font-sport text-xl text-white">✏️ Editar Perfil</h3>
              <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#18222C] text-slate-300">✕</button>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Nome Completo</label>
              <input type="text" required value="${editName}" oninput="this.defaultValue = this.value" onchange="this.setAttribute('value', this.value)" id="edit-profile-name" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18222C] border border-white/10 text-xs text-white" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Cidade</label>
              <select id="edit-profile-city" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18222C] border border-white/10 text-xs text-white">
                ${MG_CITIES.map(c => `<option value="${c.name}" ${editCity === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1.5">Esportes Favoritos</label>
              <div class="flex flex-wrap gap-1.5">
                ${SPORTS_CATALOG.map(sp => {
                  const active = editSports.includes(sp.id);
                  return `
                    <button type="button" data-edit-sport="${sp.id}" onclick="window.__toggleEditSport('${sp.id}')" class="px-2.5 py-1.5 rounded-full text-xs font-semibold border transition ${active ? 'bg-[#16A34A]/20 border-[#16A34A] text-[#22C55E]' : 'bg-[#18222C] border-white/10 text-slate-400'}">
                      ${sp.icon} ${sp.name}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <button type="submit" onclick="editName = document.getElementById('edit-profile-name').value; editCity = document.getElementById('edit-profile-city').value;" class="w-full py-3 rounded-xl bg-[#16A34A] text-white font-sport text-base tracking-wider">
              Salvar Alterações
            </button>
          </form>
        </div>
      `;
    }

    function openNewCourtModal() {
      const root = document.getElementById('modal-root');
      let selectedSports = ['society'];

      window.__toggleNewCourtSport = (sid) => {
        if (selectedSports.includes(sid)) selectedSports = selectedSports.filter(s => s !== sid);
        else selectedSports.push(sid);
        document.querySelectorAll('[data-nc-sport]').forEach(btn => {
          const id = btn.getAttribute('data-nc-sport');
          const active = selectedSports.includes(id);
          btn.className = `px-2.5 py-1 rounded-full text-[11px] font-bold border ${active ? 'bg-[#16A34A] border-[#16A34A] text-white' : 'bg-[#18222C] border-white/10 text-slate-400'}`;
        });
      };

      window.__createCourtSubmit = (e) => {
        e.preventDefault();
        const name = document.getElementById('nc-name').value.trim();
        const neighborhood = document.getElementById('nc-bairro').value.trim() || 'Centro';
        const address = document.getElementById('nc-address').value.trim();
        const surface = document.getElementById('nc-surface').value;
        const price = Number(document.getElementById('nc-price').value) || 100;

        const baseTimes = ['08:00 - 09:30', '17:30 - 19:00', '19:00 - 20:30', '20:30 - 22:00'];
        const schedule = {};
        WEEK_DAYS.forEach(d => {
          schedule[d.key] = baseTimes.map((t, i) => ({
            id: `${d.key}_${Date.now()}_${i}`,
            time: t,
            price,
            status: 'available',
            reservedBy: null,
          }));
        });

        const newCourt = {
          id: 'c_' + Date.now(),
          ownerId: appState.currentUser.id,
          name,
          neighborhood,
          address: `${address} — ${neighborhood}, Ouro Preto, MG`,
          lat: -20.3865 + (Math.random() - 0.5) * 0.015,
          lng: -43.5045 + (Math.random() - 0.5) * 0.015,
          surface,
          pricePerHour: price,
          whatsapp: '5531999990000',
          sports: selectedSports.length ? selectedSports : ['society'],
          amenities: ['Iluminação LED', 'Vestiário', 'Estacionamento'],
          image: 'https://images.unsplash.com/photo-1529900748604-07564a03e7a6?auto=format&fit=crop&w=900&q=80',
          schedule,
        };

        db.courts.push(newCourt);
        saveDatabase();
        appState.ownerSelectedCourtId = newCourt.id;
        closeModal();
        showToast('Nova quadra cadastrada com grade semanal! 🏟️');
        renderApp();
      };

      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 animate-view">
          <form onsubmit="window.__createCourtSubmit(event)" class="w-full max-w-[430px] rounded-3xl bg-[#12181F] border border-white/15 p-5 shadow-2xl space-y-3.5">
            <div class="flex items-center justify-between">
              <h3 class="font-sport text-xl text-white">🏟️ Cadastrar Nova Quadra</h3>
              <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#18222C] text-slate-300">✕</button>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-300 mb-1">Nome da Arena / Quadra *</label>
              <input id="nc-name" type="text" required placeholder="Ex: Arena Ouro Preto Sports" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18222C] border border-white/10 text-xs text-white" />
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] font-bold text-slate-300 mb-1">Bairro *</label>
                <input id="nc-bairro" type="text" required placeholder="Ex: Bauxita" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18222C] border border-white/10 text-xs text-white" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-300 mb-1">Valor / Hora (R$) *</label>
                <input id="nc-price" type="number" required value="110" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18222C] border border-white/10 text-xs text-white" />
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-300 mb-1">Rua e Número *</label>
              <input id="nc-address" type="text" required placeholder="Ex: Rua Diogo de Vasconcelos, 150" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18222C] border border-white/10 text-xs text-white" />
            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-300 mb-1">Tipo de Piso</label>
              <select id="nc-surface" class="w-full px-3.5 py-2.5 rounded-xl bg-[#18222C] border border-white/10 text-xs text-white">
                <option value="Grama Sintética">Grama Sintética</option>
                <option value="Areia Especial">Areia Especial</option>
                <option value="Parquet Poliesportivo">Parquet Poliesportivo</option>
                <option value="Saibro">Saibro</option>
              </select>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-300 mb-1.5">Esportes Aceitos</label>
              <div class="flex flex-wrap gap-1.5">
                ${SPORTS_CATALOG.slice(0, 6).map(sp => `
                  <button type="button" data-nc-sport="${sp.id}" onclick="window.__toggleNewCourtSport('${sp.id}')" class="px-2.5 py-1 rounded-full text-[11px] font-bold border ${sp.id === 'society' ? 'bg-[#16A34A] border-[#16A34A] text-white' : 'bg-[#18222C] border-white/10 text-slate-400'}">
                    ${sp.icon} ${sp.name}
                  </button>
                `).join('')}
              </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-[#16A34A] text-white font-sport text-base tracking-wider">
              Salvar Quadra e Gerar Grade
            </button>
          </form>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // 19. ORQUESTRADOR PRINCIPAL DE RENDERIZAÇÃO
    // ----------------------------------------------------------------------------
    function renderApp() {
      renderHeader();
      renderBottomNav();

      const main = document.getElementById('app-main');
      main.className = 'flex-1 pb-24 md:pb-10';

      if (!appState.currentUser && !appState.guestMode) {
        renderLoginView();
        return;
      }

      if (appState.subView === 'match_detail') {
        renderMatchDetailView();
        return;
      }
      if (appState.subView === 'match_chat') {
        renderMatchChatView();
        return;
      }
      if (appState.subView === 'court_owner') {
        renderCourtOwnerView();
        return;
      }

      switch (appState.activeTab) {
        case 'home':
          renderHomeView();
          break;
        case 'explore':
          renderExploreView();
          break;
        case 'create':
          renderCreateMatchView();
          break;
        case 'my_matches':
          renderMyMatchesView();
          break;
        case 'profile':
          renderProfileView();
          break;
        default:
          renderHomeView();
      }
    }

    // Inicialização ao carregar a janela
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
